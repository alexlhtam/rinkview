[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rinkview-cv"
version = "0.1.0"
description = "Independent rink calibration and vision utilities for RinkView"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "opencv-python-headless>=4.8,<6"]

[project.optional-dependencies]
test = ["pytest>=7", "jsonschema>=4.18"]
process = [
    "av>=14",
    "pyarrow>=15",
    "supervision>=0.25,<0.27",
    "ultralytics>=8.3,<9",
]

[project.scripts]
rinkview = "rinkview_cv.cli:main"

[tool.setuptools.packages.find]
include = ["rinkview_cv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
